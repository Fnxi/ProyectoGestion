name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Install test dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install coverage collector
        run: dotnet tool install --global dotnet-coverage

      - name: Run integration tests with coverage
        run: dotnet-coverage collect "npm test" --settings coverage.runsettings --output coverage/coverage.cobertura.xml --output-format cobertura

      - name: Run Playwright end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Enforce 70 percent line coverage
        shell: bash
        run: |
          line_rate=$(sed -n 's/.*line-rate="\([0-9.]*\)".*/\1/p' coverage/coverage.cobertura.xml | head -n 1)
          coverage=$(awk "BEGIN { printf \"%.2f\", $line_rate * 100 }")
          echo "Backend line coverage: ${coverage}%"
          awk "BEGIN { exit !($coverage >= 70) }"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura
          path: coverage/coverage.cobertura.xml
          if-no-files-found: error

      - name: Test summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Quality gates"
            echo
            echo "- Backend and API integration tests: Jest + dotnet-coverage"
            echo "- Browser E2E test: Playwright Chromium (root redirect, login, dashboard and Users CRUD access)"
            echo "- Coverage threshold: 70% lines"
            echo "- A failure in either suite blocks image publication and EC2 deployment."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/webapp-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/webapp-api:${{ github.sha }}

      - name: Publish summary
        shell: bash
        run: |
          {
            echo "## Image published"
            echo
            echo "- Immutable tag: \`${{ github.sha }}\`"
            echo "- Mutable tag: \`latest\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to EC2
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v4

      - name: Configure SSH access
        shell: bash
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_SSH_HOST_KEY: ${{ secrets.EC2_SSH_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$EC2_SSH_HOST_KEY" > ~/.ssh/known_hosts

      - name: Validate deployment configuration
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_SSH_HOST_KEY: ${{ secrets.EC2_SSH_HOST_KEY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          for setting in EC2_HOST EC2_USER EC2_SSH_KEY EC2_SSH_HOST_KEY DOCKERHUB_USERNAME; do
            if [ -z "${!setting}" ]; then
              echo "::error title=Missing deployment configuration::Required secret ${setting} is not configured."
              exit 1
            fi
          done
          echo "Deployment configuration is present. Secret values are not printed."

      - name: Verify SSH connectivity
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ConnectionAttempts=2 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=yes \
            "${EC2_USER}@${EC2_HOST}" \
            'printf "Connected to %s as %s\\n" "$(hostname)" "$(whoami)"; docker --version; nginx -v; curl --version | head -n 1'

      - name: Deploy the immutable image to EC2
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/webapp-api:${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o ConnectTimeout=20 \
            -o ConnectionAttempts=2 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=yes \
            "${EC2_USER}@${EC2_HOST}" "IMAGE='${IMAGE}' bash -s" < scripts/deploy-ec2.sh

      - name: Verify public application health
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          health_url="http://${EC2_HOST}/api/health"
          echo "Checking public health endpoint after deployment."
          curl --fail --show-error --silent \
            --connect-timeout 10 \
            --max-time 20 \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 5 \
            "$health_url"
          echo

      - name: Deployment summary
        if: always()
        shell: bash
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/webapp-api:${{ github.sha }}
        run: |
          {
            echo "## EC2 deployment"
            echo
            echo "- Image: \`${IMAGE}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Public health endpoint was checked after the remote deployment."
          } >> "$GITHUB_STEP_SUMMARY"

  pipeline-observability:
    name: Record pipeline execution
    needs: [test, publish, deploy]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout reporting script
        uses: actions/checkout@v4

      - name: Send pipeline event to OpenObserve
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENOBSERVE_URL: ${{ vars.OPENOBSERVE_URL }}
          OPENOBSERVE_ORGANIZATION: ${{ vars.OPENOBSERVE_ORGANIZATION }}
          OPENOBSERVE_PIPELINE_STREAM: ${{ vars.OPENOBSERVE_PIPELINE_STREAM }}
          OPENOBSERVE_USERNAME: ${{ secrets.OPENOBSERVE_USERNAME }}
          OPENOBSERVE_PASSWORD: ${{ secrets.OPENOBSERVE_PASSWORD }}
          PIPELINE_TEST_RESULT: ${{ needs.test.result }}
          PIPELINE_PUBLISH_RESULT: ${{ needs.publish.result }}
          PIPELINE_DEPLOY_RESULT: ${{ needs.deploy.result }}
          PIPELINE_ENVIRONMENT: production
        run: node scripts/pipeline-observability.js

      - name: Observability summary
        if: always()
        shell: bash
        env:
          OPENOBSERVE_URL: ${{ vars.OPENOBSERVE_URL }}
          OPENOBSERVE_ORGANIZATION: ${{ vars.OPENOBSERVE_ORGANIZATION }}
          OPENOBSERVE_PIPELINE_STREAM: ${{ vars.OPENOBSERVE_PIPELINE_STREAM }}
          OPENOBSERVE_USERNAME: ${{ secrets.OPENOBSERVE_USERNAME }}
          OPENOBSERVE_PASSWORD: ${{ secrets.OPENOBSERVE_PASSWORD }}
        run: |
          configured=true
          for setting in OPENOBSERVE_URL OPENOBSERVE_ORGANIZATION OPENOBSERVE_PIPELINE_STREAM OPENOBSERVE_USERNAME OPENOBSERVE_PASSWORD; do
            [ -n "${!setting}" ] || configured=false
          done
          {
            echo "## OpenObserve"
            echo
            if [ "$configured" = true ]; then
              echo "- Event delivery was attempted (credentials and URL are not displayed)."
            else
              echo "- Event delivery was skipped because the OpenObserve configuration is incomplete."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
