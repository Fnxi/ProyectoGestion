# Agente independiente para Ubuntu/EC2. No contiene endpoints ni credenciales.
receivers:
  hostmetrics:
    collection_interval: 60s
    root_path: /hostfs
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.linux.memory.available:
            enabled: true
          system.memory.limit:
            enabled: true
          system.memory.utilization:
            enabled: true
      network:
        exclude:
          interfaces: [lo]
          match_type: strict
      filesystem:
        exclude_fs_types:
          fs_types: [tmpfs, devtmpfs, overlay, squashfs]
          match_type: strict
        metrics:
          system.filesystem.utilization:
            enabled: true
      system:

processors:
  resource/ec2:
    attributes:
      - key: service.name
        action: upsert
        value: ${env:OTEL_SERVICE_NAME}
      - key: deployment.environment.name
        action: upsert
        value: ${env:DEPLOYMENT_ENVIRONMENT}
      - key: host.name
        action: upsert
        value: ${env:EC2_INSTANCE_NAME}
      - key: cloud.provider
        action: upsert
        value: aws
      - key: cloud.platform
        action: upsert
        value: aws_ec2
  batch:
    timeout: 10s
    send_batch_size: 1024

exporters:
  otlphttp/openobserve:
    endpoint: ${env:OPENOBSERVE_OTLP_METRICS_ENDPOINT}
    headers:
      Authorization: ${env:OPENOBSERVE_OTLP_AUTHORIZATION}
      organization: ${env:OPENOBSERVE_ORGANIZATION}
      stream-name: ${env:OPENOBSERVE_METRICS_STREAM}
    compression: gzip
    timeout: 10s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1000

service:
  pipelines:
    metrics:
      receivers: [hostmetrics]
      processors: [resource/ec2, batch]
      exporters: [otlphttp/openobserve]
